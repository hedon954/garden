# Link card refresh Worker. Not deployed by CI; deploy by hand when wanted:
#   npx wrangler deploy --config worker/og/wrangler.toml
name = "garden-og"
main = "index.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
SITE_ORIGIN = "https://hedon.top"
ALLOWED_ORIGINS = "https://hedon.top"
ALLOW_LOCALHOST = "1"
RATE_PER_MINUTE = "30"

# Optional: Cloudflare's rate limiting binding, shared across isolates.
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1001"
# simple = { limit = 30, period = 60 }
