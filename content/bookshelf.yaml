# Real reading-notes shelf for hedon.top — sourced from columns.yaml slug: book-note.
# Covers are site media paths (content/covers → /media/covers/…).
# `post` is path under content/posts without .md; garden must load that body as the open-book note.

title: 读书笔记
description: 本专栏主要记录笔者在阅读书籍过程中，对书籍内容的思考和总结。
eyebrow: 花园 · 读书笔记

shelves:
  - id: book-note
    name: 读书笔记
    books:
      - id: note-obsidian
        title: 上头 Obsidian
        spine: 上头 Obsidian
        author: 读书笔记
        size: s-tall
        cover: /media/covers/note-obsidian.jpg
        color: "#2a2140"
        post: note/note-obsidian
      - id: note-llm-from-scratch
        title: 从零构建大语言模型
        spine: 从零构建大语言模型
        author: 读书笔记
        size: s-tall
        cover: /media/covers/note-llm-from-scratch.jpg
        color: "#14343a"
        post: note/note-llm-from-scratch
      - id: note-fosa
        title: Fundamentals of Software Architecture
        spine: FOSA
        author: 读书笔记
        size: s-mid
        cover: /media/covers/note-fosa.jpg
        color: "#1e3a24"
        post: note/note-fosa
        sources:
          - label: 豆瓣
            href: https://book.douban.com/subject/34464806/
      - id: note-rust-atomics-and-locks
        title: Rust Atomics and Locks
        spine: Rust Atomics and Locks
        author: 读书笔记
        size: s-tall
        cover: /media/covers/note-rust-atomics-and-locks.jpeg
        color: "#6b2e1a"
        post: note/note-rust-atomics-and-locks
      - id: unit-testing
        title: Unit Testing
        spine: Unit Testing
        author: 读书笔记
        size: s-mid
        cover: /media/covers/note-unit-testing.jpg
        color: "#1a2744"
        posts:
          - path: note/note-unit-testing
            kind: overview
          - path: note/note-unit-testing-excerpt
            kind: excerpt
      - id: note-ddd-awareness
        title: 悟道领域驱动设计
        spine: 悟道领域驱动设计
        author: 读书笔记
        size: s-mid
        cover: /media/covers/note-ddd-awareness.png
        color: "#6e3b2a"
        post: note/note-ddd-awareness
