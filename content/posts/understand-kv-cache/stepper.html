<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stepper fixture</title>
  <style>
    body { margin: 0; font: 16px/1.5 sans-serif; }
    main { padding: 24px; }
  </style>
</head>
<body>
  <main id="r">
    <p>Synthetic stepper fixture.</p>
  </main>
  <script>
    function report() {
      var height = Math.ceil(document.getElementById("r").getBoundingClientRect().bottom) + 4;
      window.parent.postMessage({ source: "garden-chart", height: height }, "*");
    }
    report();
    window.addEventListener("load", report);
  </script>
</body>
</html>
