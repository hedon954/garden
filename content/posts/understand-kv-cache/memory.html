<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KV 显存墙</title>
  <style>
    :root {
      --paper: #f8f8f6; --ink: #202124; --muted: #65707d; --faint: #a1a6ad;
      --line: #deded9; --accent: #d82d48; --s7: #1f7a4d; --s13: #2e5aa8; --s70: #d82d48;
    }
    :root[data-theme="dark"] {
      --paper: #171819; --ink: #ededeb; --muted: #a6adb6; --faint: #747b84;
      --line: #35383b; --accent: #ff5d76; --s7: #5ee0a0; --s13: #8eb4ff; --s70: #ff5d76;
    }
    html, body { margin: 0; background: var(--paper); color: var(--ink); }
    body {
      font: 13px/1.5 ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      padding: 16px;
    }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
    label { color: var(--muted); display: flex; align-items: center; gap: 10px; }
    input[type="range"] { width: 180px; }
    svg { width: 100%; height: auto; display: block; }
    .axis { stroke: var(--line); fill: none; }
    .tick { fill: var(--muted); font-size: 10px; font-family: inherit; }
    .ref { stroke: var(--faint); stroke-dasharray: 4 3; }
    .ref-label { fill: var(--muted); font-size: 10px; font-family: inherit; }
    .legend { fill: var(--ink); font-size: 11px; font-family: inherit; }
    .tip {
      margin-top: 8px; min-height: 1.4em; color: var(--ink-soft, var(--muted)); font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <label>Batch size: <strong id="batch-read">1</strong>
      <input id="batch" type="range" min="1" max="32" step="1" value="1">
    </label>
    <span id="hover" class="tip">移动鼠标查看某一序列长度下的 KV 显存。</span>
  </div>
  <svg id="chart" viewBox="0 0 680 360" role="img" aria-label="KV cache 随序列长度增长"></svg>
  <script>
    const series = [
      { id: "7B", L: 32, H: 32, color: "var(--s7)" },
      { id: "13B", L: 40, H: 40, color: "var(--s13)" },
      { id: "70B", L: 80, H: 64, color: "var(--s70)" },
    ];
    const refs = [
      { label: "RTX 4090", y: 24 },
      { label: "A100 40GB", y: 40 },
      { label: "A100 80GB / H100", y: 80 },
    ];
    const xTicks = [512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072];
    const xMin = Math.log2(512);
    const xMax = Math.log2(131072);
    const plot = { x: 56, y: 20, w: 600, h: 280 };
    const yMax = 160;

    const kv = (model, seq, batch) => 2 * model.L * model.H * 128 * seq * batch * 2 / (1024 ** 3);
    const xAt = (seq) => plot.x + ((Math.log2(seq) - xMin) / (xMax - xMin)) * plot.w;
    const yAt = (gb) => plot.y + plot.h - (Math.min(gb, yMax) / yMax) * plot.h;
    const compact = (seq) => seq >= 1024 ? `${seq / 1024}K` : String(seq);
    const gbText = (value) => value >= 10 ? value.toFixed(0) : value >= 1 ? value.toFixed(1) : value.toFixed(2);

    const svg = document.getElementById("chart");
    const ns = "http://www.w3.org/2000/svg";
    const el = (name, attrs) => {
      const node = document.createElementNS(ns, name);
      Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
      return node;
    };

    function samples(batch) {
      return Array.from({ length: 81 }, (_, index) => {
        const seq = 2 ** (xMin + (xMax - xMin) * (index / 80));
        return { seq, values: Object.fromEntries(series.map((model) => [model.id, kv(model, seq, batch)])) };
      });
    }

    function pathFor(points, id) {
      return points.map((point, index) => `${index === 0 ? "M" : "L"} ${xAt(point.seq).toFixed(1)} ${yAt(point.values[id]).toFixed(1)}`).join(" ");
    }

    function draw(batch, hoverSeq) {
      svg.replaceChildren();
      svg.appendChild(el("line", { class: "axis", x1: plot.x, y1: plot.y, x2: plot.x, y2: plot.y + plot.h }));
      svg.appendChild(el("line", { class: "axis", x1: plot.x, y1: plot.y + plot.h, x2: plot.x + plot.w, y2: plot.y + plot.h }));
      for (let y = 0; y <= yMax; y += 20) {
        const yy = yAt(y);
        svg.appendChild(el("text", { class: "tick", x: plot.x - 8, y: yy + 3, "text-anchor": "end" })).textContent = String(y);
      }
      xTicks.forEach((seq) => {
        svg.appendChild(el("text", { class: "tick", x: xAt(seq), y: plot.y + plot.h + 16, "text-anchor": "middle" })).textContent = compact(seq);
      });
      svg.appendChild(el("text", { class: "tick", x: plot.x + plot.w / 2, y: 352, "text-anchor": "middle" })).textContent = "sequence length";
      svg.appendChild(el("text", { class: "tick", x: 14, y: 16 })).textContent = "KV cache (GB)";

      refs.forEach((ref) => {
        const yy = yAt(ref.y);
        svg.appendChild(el("line", { class: "ref", x1: plot.x, y1: yy, x2: plot.x + plot.w, y2: yy }));
        svg.appendChild(el("text", { class: "ref-label", x: plot.x + plot.w - 4, y: yy - 4, "text-anchor": "end" })).textContent = `${ref.label} ${ref.y}G`;
      });

      const points = samples(batch);
      series.forEach((model, index) => {
        svg.appendChild(el("path", { d: pathFor(points, model.id), fill: "none", stroke: model.color, "stroke-width": "2" }));
        svg.appendChild(el("text", { class: "legend", x: plot.x + 8, y: plot.y + 16 + index * 16, fill: model.color })).textContent = model.id;
        refs.forEach((ref) => {
          const seq = ref.y * (1024 ** 3) / (2 * model.L * model.H * 128 * batch * 2);
          if (seq >= 512 && seq <= 131072) {
            svg.appendChild(el("circle", { cx: xAt(seq), cy: yAt(ref.y), r: 3, fill: model.color }));
          }
        });
      });

      if (hoverSeq) {
        const values = Object.fromEntries(series.map((model) => [model.id, kv(model, hoverSeq, batch)]));
        svg.appendChild(el("line", { x1: xAt(hoverSeq), y1: plot.y, x2: xAt(hoverSeq), y2: plot.y + plot.h, stroke: "currentColor", "stroke-opacity": "0.25" }));
        series.forEach((model) => {
          svg.appendChild(el("circle", { cx: xAt(hoverSeq), cy: yAt(values[model.id]), r: 4, fill: model.color }));
        });
        document.getElementById("hover").textContent =
          `Seq: ${compact(hoverSeq)} | 7B: ${gbText(values["7B"])} GB | 13B: ${gbText(values["13B"])} GB | 70B: ${gbText(values["70B"])} GB`;
      }
    }

    const batchInput = document.getElementById("batch");
    let hoverSeq = 4096;
    const render = () => {
      const batch = Number(batchInput.value);
      document.getElementById("batch-read").textContent = String(batch);
      draw(batch, hoverSeq);
    };
    batchInput.addEventListener("input", render);
    svg.addEventListener("mousemove", (event) => {
      const box = svg.getBoundingClientRect();
      const x = (event.clientX - box.left) / box.width * 680;
      const ratio = Math.min(1, Math.max(0, (x - plot.x) / plot.w));
      hoverSeq = 2 ** (xMin + ratio * (xMax - xMin));
      render();
    });
    svg.addEventListener("mouseleave", () => {
      hoverSeq = 4096;
      document.getElementById("hover").textContent = "移动鼠标查看某一序列长度下的 KV 显存。";
      render();
    });
    render();

    const theme = new URLSearchParams(location.search).get("theme");
    if (theme === "dark" || theme === "light") document.documentElement.setAttribute("data-theme", theme);
    const report = () => {
      if (window.parent === window) return;
      const height = Math.ceil(Math.max(
        document.body.scrollHeight,
        document.body.offsetHeight,
        document.documentElement.scrollHeight,
      ));
      window.parent.postMessage({ source: "garden-chart", height }, "*");
    };
    new ResizeObserver(report).observe(document.body);
    window.addEventListener("load", report);
    requestAnimationFrame(() => requestAnimationFrame(report));
  </script>
</body>
</html>
