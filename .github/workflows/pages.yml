name: Deploy public blog to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "design-qa.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    # 项目子路径会破坏静态文章路由。只有根路径仓库或已配置自定义域名时才部署。
    if: github.event.repository.name == format('{0}.github.io', github.repository_owner) || vars.SITE_URL != ''
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve the public URL
        env:
          SITE_URL_OVERRIDE: ${{ vars.SITE_URL }}
          ADMIN_URL_OVERRIDE: ${{ vars.ADMIN_URL }}
          GISCUS_REPO: ${{ vars.GISCUS_REPO }}
          GISCUS_REPO_ID: ${{ vars.GISCUS_REPO_ID }}
          GISCUS_CATEGORY: ${{ vars.GISCUS_CATEGORY }}
          GISCUS_CATEGORY_ID: ${{ vars.GISCUS_CATEGORY_ID }}
          WEBMENTION_IO_DOMAIN: ${{ vars.WEBMENTION_IO_DOMAIN }}
          ANALYTICS_DOMAIN: ${{ vars.ANALYTICS_DOMAIN }}
          ANALYTICS_SCRIPT: ${{ vars.ANALYTICS_SCRIPT }}
        run: |
          owner="$GITHUB_REPOSITORY_OWNER"
          default_url="https://$owner.github.io"
          echo "SITE_URL=${SITE_URL_OVERRIDE:-$default_url}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=${SITE_URL_OVERRIDE:-$default_url}" >> "$GITHUB_ENV"
          echo "ADMIN_URL=$ADMIN_URL_OVERRIDE" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_GISCUS_REPO=$GISCUS_REPO" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_GISCUS_REPO_ID=$GISCUS_REPO_ID" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_GISCUS_CATEGORY=$GISCUS_CATEGORY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_GISCUS_CATEGORY_ID=$GISCUS_CATEGORY_ID" >> "$GITHUB_ENV"
          echo "WEBMENTION_IO_DOMAIN=$WEBMENTION_IO_DOMAIN" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_ANALYTICS_DOMAIN=$ANALYTICS_DOMAIN" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_ANALYTICS_SCRIPT=$ANALYTICS_SCRIPT" >> "$GITHUB_ENV"
          echo "STATIC_EXPORT=1" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - id: deployment
        uses: actions/deploy-pages@v4
