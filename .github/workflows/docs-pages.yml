name: Build and deploy Garden handbook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-garden-docs
  cancel-in-progress: true

jobs:
  build-docs:
    if: github.repository == 'hedon954/garden'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore generated Garden caches
        uses: actions/cache@v4
        with:
          path: |
            .garden/image-sizes.json
            .garden/link-assets.json
            public/link-assets
          key: ${{ runner.os }}-garden-docs-cache-v1-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-garden-docs-cache-v1-${{ github.ref_name }}-

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build standalone Garden documentation site (/garden)
        env:
          SITE_URL: ${{ vars.DOCS_SITE_URL || 'https://hedon.top' }}
          NEXT_PUBLIC_BASE_PATH: /garden
          ANALYTICS_DOMAIN: ${{ vars.ANALYTICS_DOMAIN }}
          ANALYTICS_SCRIPT: ${{ vars.ANALYTICS_SCRIPT }}
        run: |
          export NEXT_PUBLIC_ANALYTICS_DOMAIN="$ANALYTICS_DOMAIN"
          export NEXT_PUBLIC_ANALYTICS_SCRIPT="$ANALYTICS_SCRIPT"
          npm run docs:build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Garden docs Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/docs-client

  deploy-docs:
    if: github.repository == 'hedon954/garden'
    needs: build-docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Garden docs to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
