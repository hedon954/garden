name: Verify blog

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Verify GitHub Pages export
        env:
          STATIC_EXPORT: "1"
          SITE_URL: https://example.github.io
          NEXT_PUBLIC_SITE_URL: https://example.github.io
          ADMIN_URL: https://admin.example.com
        run: npm run build
