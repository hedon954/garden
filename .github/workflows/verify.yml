name: Verify blog

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    if: github.event_name == 'pull_request' || (github.event.repository.name != format('{0}.github.io', github.repository_owner) && vars.SITE_URL == '' && vars.PAGES_REPOSITORY == '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Lockfile downloads only from registry.npmjs.org
        run: node scripts/check-lockfile-registry.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: A new site from garden init installs the packed engine and builds
        env:
          GARDEN_INIT_BUILD: "1"
        run: node --test --test-name-pattern="installs the packed" tests/garden-init.test.mjs
      - name: Verify GitHub Pages export
        env:
          STATIC_EXPORT: "1"
          SITE_URL: https://example.github.io
          NEXT_PUBLIC_SITE_URL: https://example.github.io
          ADMIN_URL: https://admin.example.com
        run: npm run build && npm run pages:validate
      - name: "Check the export: internal links end with a slash, every page names its canonical address, the feed keeps its guids, no markup the parser repairs, /favicon.ico is there"
        run: node scripts/handbook-facts.mjs && node --test tests/static-links.test.mjs tests/canonical-links.test.mjs tests/rss-guids.test.mjs tests/html-nesting.test.mjs tests/static-params.test.mjs tests/static-export-payloads.test.mjs tests/favicon-ico.test.mjs tests/pages-output.test.mjs
