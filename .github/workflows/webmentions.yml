name: Send Webmentions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Send mentions found in the public RSS feed
        env:
          SITE_URL_OVERRIDE: ${{ vars.SITE_URL }}
        run: |
          default_url="https://$GITHUB_REPOSITORY_OWNER.github.io"
          SITE_URL="${SITE_URL_OVERRIDE:-$default_url}" npm run webmentions:send
