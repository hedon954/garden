name: Publish npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm install --global npm@11
      - name: Lockfile downloads only from registry.npmjs.org
        run: node scripts/check-lockfile-registry.mjs
      - run: npm ci
      - name: Garden and extension release versions must match
        run: node scripts/sync-editor-version.mjs --check
      - run: npm test

      - name: Publish hd-garden
        run: npm publish --access public

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            version="$(node -p "require('./package.json').version")"
            gh release create "$tag" --generate-notes \
              "editors/dist/vscode/garden-ui-${version}.vsix" \
              "editors/dist/garden-typora-${version}.zip"
          fi
