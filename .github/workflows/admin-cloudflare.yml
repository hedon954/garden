name: Deploy admin to Cloudflare

on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: Cloudflare Worker 名称
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy the independent admin service
        run: npx wrangler deploy --config dist/server/wrangler.json --name "$WORKER_NAME"
        env:
          WORKER_NAME: ${{ inputs.worker_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
