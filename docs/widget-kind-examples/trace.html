<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Go GPM 调度轨迹</title>
  <style>
    :root {
      --paper: #f8f8f6; --ink: #202124; --muted: #65707d; --line: #deded9;
      --accent: #d82d48; --accent-soft: #f9e8eb; --soft: #eeeeeb;
    }
    :root[data-theme="dark"] {
      --paper: #171819; --ink: #ededeb; --muted: #a6adb6; --line: #35383b;
      --accent: #ff5d76; --accent-soft: #3b242a; --soft: #202224;
    }
    html, body { margin: 0; background: var(--paper); color: var(--ink); }
    body {
      font: 13px/1.5 ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      padding: 16px;
    }
    .note { min-height: 2.6em; margin-bottom: 8px; }
    svg { width: 100%; height: auto; display: block; }
    .node { fill: var(--paper); stroke: var(--line); }
    .node.is-on { fill: var(--accent-soft); stroke: var(--accent); }
    .label { fill: var(--ink); font-size: 12px; font-family: inherit; }
    .edge { fill: none; stroke: var(--line); stroke-width: 1.4; }
    .edge.is-on { stroke: var(--accent); stroke-width: 2; }
    .edge-label { fill: var(--muted); font-size: 10px; font-family: inherit; }
    .controls { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    button, .pill {
      border: 1px solid var(--line); background: var(--paper); color: var(--ink);
      font: inherit; padding: 6px 10px;
    }
    button:disabled { color: var(--muted); }
    .pill.is-on { color: var(--accent); border-color: var(--accent); }
  </style>
</head>
<body>
  <p class="note" id="note"></p>
  <svg viewBox="0 0 640 220" aria-hidden="true">
    <path id="steal" class="edge" d="M 120 48 H 320 Q 328 48 328 56 V 88" marker-end="url(#arrow)" />
    <path id="g0-p0" class="edge" d="M 168 168 H 300 Q 308 168 308 160 V 136" marker-end="url(#arrow)" />
    <path id="g1-p0" class="edge" d="M 248 168 H 300 Q 308 168 308 160 V 136" marker-end="url(#arrow)" />
    <path id="p0-m0" class="edge" d="M 400 112 H 500" marker-end="url(#arrow)" />
    <rect id="gq" class="node" x="40" y="24" width="160" height="48" rx="4" />
    <rect id="p0" class="node" x="260" y="88" width="120" height="48" rx="4" />
    <rect id="m0" class="node" x="500" y="88" width="100" height="48" rx="4" />
    <rect id="g0" class="node" x="80" y="156" width="88" height="40" rx="4" />
    <rect id="g1" class="node" x="188" y="156" width="88" height="40" rx="4" />
    <text class="label" x="120" y="53" text-anchor="middle">全局队列</text>
    <text class="label" x="320" y="117" text-anchor="middle">P0</text>
    <text class="label" x="550" y="117" text-anchor="middle">M0</text>
    <text class="label" x="124" y="181" text-anchor="middle">G0</text>
    <text class="label" x="232" y="181" text-anchor="middle">G1</text>
    <text id="steal-label" class="edge-label" x="200" y="40">steal</text>
    <text class="edge-label" x="230" y="152">绑定</text>
    <text class="edge-label" x="450" y="104">绑定</text>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#65707d" />
      </marker>
    </defs>
  </svg>
  <div class="controls">
    <button type="button" id="prev">上一步</button>
    <span class="pill" id="pill">1 / 3</span>
    <button type="button" id="next">下一步</button>
  </div>
  <script>
    const steps = [
      { label: "新建 G", nodes: ["g0", "p0"], edges: ["g0-p0"], note: "新 Goroutine 优先进 P0 本地队列，不超过 256 个。" },
      { label: "执行", nodes: ["g0", "p0", "m0"], edges: ["g0-p0", "p0-m0"], note: "P0 已绑到系统线程 M0。G0 从本地队列取出，在 M0 上运行。" },
      { label: "偷取", nodes: ["gq", "p0"], edges: ["steal"], note: "本地空了，P0 从全局队列一次偷一批，减少锁竞争。" },
    ];
    let index = 0;
    const note = document.getElementById("note");
    const pill = document.getElementById("pill");

    function render() {
      const step = steps[index];
      note.textContent = `${step.label} · ${step.note}`;
      pill.textContent = `${index + 1} / ${steps.length}`;
      document.querySelectorAll(".node").forEach((node) => {
        node.classList.toggle("is-on", step.nodes.includes(node.id));
      });
      document.querySelectorAll(".edge").forEach((edge) => {
        edge.classList.toggle("is-on", step.edges.includes(edge.id));
      });
      document.getElementById("prev").disabled = index === 0;
      document.getElementById("next").disabled = index === steps.length - 1;
    }

    document.getElementById("prev").addEventListener("click", () => { index = Math.max(0, index - 1); render(); });
    document.getElementById("next").addEventListener("click", () => { index = Math.min(steps.length - 1, index + 1); render(); });
    render();

    const theme = new URLSearchParams(location.search).get("theme");
    if (theme === "dark" || theme === "light") document.documentElement.setAttribute("data-theme", theme);
    const report = () => {
      if (window.parent === window) return;
      const height = Math.ceil(Math.max(
        document.body.scrollHeight,
        document.body.offsetHeight,
        document.documentElement.scrollHeight,
      ));
      window.parent.postMessage({ source: "garden-chart", height }, "*");
    };
    new ResizeObserver(report).observe(document.body);
    window.addEventListener("load", report);
    requestAnimationFrame(() => requestAnimationFrame(report));
  </script>
</body>
</html>
